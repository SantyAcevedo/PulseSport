plugins { id 'com.android.application' }
android {
    namespace 'co.edu.pulsesport'
    compileSdk 35
    defaultConfig { applicationId 'co.edu.pulsesport'; minSdk 26; targetSdk 35; versionCode 9; versionName '1.5.0'; testInstrumentationRunner 'android.test.InstrumentationTestRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
